<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Complete Layout</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <header class="site-header">My Site</header>
  <main>
    <section class="hero">
      <div class="hero-text">Welcome to My Site</div>
    </section>

    <section class="about">
      <div class="about-text">
        <h2>About</h2>
        <p>Two-column about section with text and image.</p>
      </div>
      <div class="about-image"><img src="img6.svg" alt="about image"></div>
    </section>

    <section class="services">
      <div class="service">Service A</div>
      <div class="service">Service B</div>
      <div class="service">Service C</div>
    </section>

    <section class="contact">
      <form>
        <label>Name<input type="text"></label>
        <label>Message<textarea></textarea></label>
        <button>Send</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">© 2025 My Site</footer>
</body>
</html>
