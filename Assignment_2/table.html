<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>

<body>
    <table border=1 cellspacing=5 cellpadding=10>
        
        <thead>
        <tr>
            <td colspan="3">Table Attributes</td>
        </tr>
        <tr>
            <th>Attribute</th>
            <th>Purpose</th>
            <th>Example</th>
        </tr>
        </thead>
        <tr>
            <td>border</td>
            <td>Border thickness</td>
            <td>border="2"</td>
        </tr>
        <tr>
            <td>cellpadding</td>
            <td>Space inside cells</td>
            <td>cellpadding="10"</td>
        </tr>
        <tr>
            <td>cellspacing</td>
            <td>Space between cells</td>
            <td>cellspacing="5"</td>
        </tr>
        <tr>
            <td>colspan</td>
            <td>Merge columns</td>
            <td>td colspan="2" </td>
        </tr>
        <tr>
            <td>rowspan</td>
            <td>Merge rows</td>
            <td>td rowspan="2"</td>
        </tr>
    </table>
       



</body>

</html>
