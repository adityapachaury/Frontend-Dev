<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown-based Selection Page</title>
</head>
<body>
    <h1>Travel Selection Form</h1>
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>USA</option>
            <option>France</option>
            <option>Japan</option>
        </select>
        <br><br>
        <label for="state">State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Maharashtra</option>
            <option>California</option>
            <option>Île-de-France</option>
            <option>Kyoto</option>
        </select>
        <br><br>
        <label for="city">City:</label>
        <select id="city" name="city">
            <option selected>Agra</option>
            <option>Mumbai</option>
            <option>Los Angeles</option>
            <option>Paris</option>
            <option>Kyoto</option>
        </select>
        <br><br>
        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Gateway of India</option>
            <option>Hollywood Sign</option>
            <option>Eiffel Tower</option>
            <option>Fushimi Inari Shrine</option>
        </select>
    </form>
    <br>
    <p>
        You have selected: <strong>India</strong> &rarr; <strong>Uttar Pradesh</strong> &rarr; <strong>Agra</strong> &rarr; <strong>Taj Mahal</strong>.
    </p>
</body>

</html>
