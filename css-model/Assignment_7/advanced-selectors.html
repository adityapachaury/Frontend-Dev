<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advanced Selectors</title>
  <link rel="stylesheet" href="advanced-selectors.css">
</head>
<body>
  <header><h1>Welcome...</h1></header>
  <main>
    <form>
    
      <label>Text input: <input type="text" placeholder="Type here"></label>
    </form>
    <nav>
      <ul>
        <li><a href="https://example.com">External Link</a></li>
        <li><a href="/local">Local Link</a></li>
        <li><a href="https://another.com">Another External</a></li>
        <li class="special">Special Item</li>
        <li>Last Item</li>
      </ul>
    </nav>
    <section class="list">
      <p>Items below demonstrate pseudo-elements and combinators:</p>
      <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
        <li>Fourth</li>
      </ol>
    </section>
  </main>
  <footer>© 2025</footer>
</body>
</html>
