<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Borders & Padding</title>
  <link rel="stylesheet" href="borders-padding.css">
</head>
<body>
  <header><h1>Borders & Padding Demonstration</h1></header>
  <main class="demo" role="main">
    <!-- Boxes showing different border styles, rounded corners and padding -->
    <div class="box solid">Solid<br><span class="note">padding:16px</span></div>
    <div class="box dashed">Dashed<br><span class="note">padding:8px</span></div>
    <div class="box double">Double<br><span class="note">padding:24px</span></div>
    <div class="box groove">Groove<br><span class="note">border-radius:16px</span></div>
  </main>
  <footer>&copy; 2025</footer>
</body>
</html>
