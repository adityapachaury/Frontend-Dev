<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Outline & Focus Form</title>
  <link rel="stylesheet" href="outline-form.css">
</head>
<body>
  <main class="form-wrap">
    <form class="demo-form" action="#" method="post" novalidate>
      <label> Name <input type="text" name="name" placeholder="Your name"></label>
      <label> Email <input type="email" name="email" placeholder="you@example.com"></label>
      <label> Message <textarea name="msg" rows="4" placeholder="Write something..."></textarea></label>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
